<table>
    <tr style="vertical-align: middle;">
        <td style="width: 1px;"></td>
        <td>
            <img src="https://lightskyblue-meerkat-268765.hostingersite.com/Imagens/hr_logo.png"
                style="margin-bottom: -8px;"/>
        </td>
    </tr>
</table>
<nav class="menu">
    <ul>
        <li *ngFor="let item of itens"
            [routerLink]="item.path"
             routerLinkActive="ativo">
            <a> {{ item.name }}</a>
        </li>
    </ul>
</nav>

<form [formGroup]="formulario" ngSubmit="gravar()"
      style="margin-top: 20px;">
    <label style="width: 60px; text-align: right; display: inline-block; font-weight: bold;" for="Nome">Nome:&nbsp;</label>
    <input type="text" id="Nome" formControlName="Nome" 
           style="width: 360px; height: 24px; margin-right: 10px;"/>
    <div *ngIf="formulario.get('Nome')?.invalid && formulario.get('Nome')?.touched">
        Nome é obrigatório.
    </div>

    <label for="Ano" style="font-weight: bold;">Ano:&nbsp;</label>
    <input type="number" id="Ano" formControlName="Ano" 
           style="width: 50px; height: 24px; text-align: center;"/>
    <div *ngIf="formulario.get('Ano')?.invalid && formulario.get('Ano')?.touched">
        Ano é obrigatório.
    </div>

    <label for="Ativo" style="margin-left: 10px; font-weight: bold;">Ativo:&nbsp;</label>
    <input type="checkbox" id="Ativo" formControlName="Ativo"
           style="height: 24px; vertical-align: middle;" />

    <input type="hidden" formControlName="IdCampeonato" />

    <button type="button" (click)="gravar()"
            style="margin-left: 20px;"
            class="btn-ativo">Gravar</button>
</form>

<table class="tableDados" style="margin-top: 16px; margin-left: 10px;">
    <thead>
        <tr class="tableHead">
            <th style="width: 117px; text-align: center;">IdCampeonato</th>
            <th style="width: 240px; text-align: left; padding-left: 4px;">Nome do Campeonato</th>
            <th style="width: 60px;">Ano</th>
            <th style="width: 60px;">Ativo</th>
            <th></th>
            <th></th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let campeonato of listaCampeonatos">
            <td style="text-align: center;">{{ campeonato.IdCampeonato }}</td>
            <td style="padding-left: 4px;">{{ campeonato.Nome }}</td>
            <td style="text-align: center;">{{ campeonato.Ano }}</td>
            <td style="text-align: center;">{{ campeonato.Ativo ? 'Sim' : 'Não' }}</td> 
            <td>
                <button class="btn-primary" (click)="abrirTimes(campeonato)">Times</button>
            </td>
            <td>
                <button class="btn-primary" (click)="jogosCampeonato(campeonato)">Jogos</button>
            </td>
            <td>
                <button class="btn-primary" (click)="ranking(campeonato)">Ranking</button>
            </td>
        </tr>
    </tbody>
</table>
