<table>
    <tr style="vertical-align: middle;">
        <td style="width: 1px;"></td>
        <td style="padding-top: 5px;">
            <img src="https://lightskyblue-meerkat-268765.hostingersite.com/Imagens/hr_logo.png"
                 style="margin-bottom: -8px;"/>
        </td>
    </tr>
</table>

<div style="height: 252px; vertical-align: top; padding-left: 10px; overflow-y: scroll;">
    <table class="tableDados">
        <thead class="tableHead">
            <tr>
                <th style="width: 81px;">Data</th>
                <th style="width: 51px;">Hora</th>
                <th style="width: 150px; text-align: start; padding-left: 4px;">Time da Casa</th>
                <th style="width: 30px;"></th>
                <th style="width: 20px;">x</th>
                <th style="width: 30px;"></th>
                <th style="width: 150px; text-align: start; padding-left: 4px;">Time Visitante</th>
                <th style="width: 75px;">Resultado</th>
                <th style="width: 54px;">Pontos</th>
            </tr>
        </thead>
        <tbody class="tableBody">
            <tr *ngFor="let jogo of listaJogos">
                <td style="text-align: center;">{{ jogo.Dd_Mm_Yyyy }}</td>
                <td style="text-align: center;">{{ jogo.Hh_Mm }}</td>
                <td style="padding-left: 4px;">{{ jogo.TimeCasa }}</td>
                <td style="text-align: center;">{{ jogo.GolsApostaTimeCasa }}</td>
                <td style="text-align: center;">x</td>
                <td style="text-align: center;">{{ jogo.GolsApostaTimeVisitante }}</td>
                <td style="padding-left: 4px;">{{ jogo.TimeVisitante }}</td>
                <td style="text-align: center;">{{ jogo.Resultado }}</td>
                <td style="text-align: center;">{{ jogo.Pontos }}</td>
            </tr>
        </tbody>
    </table>
</div>

<span style="width: 714px; text-align: end; margin-top: 10px;">
    <button type="button" class="btn-ativo" (click)="fechar()">Fechar</button>
</span>
