<table>
    <tr style="vertical-align: middle;">
        <td style="width: 1px;"></td>
        <td>
            <img src="https://bisque-antelope-888426.hostingersite.com/hr_logo.png"
                style="margin-bottom: -8px;"/>
        </td>
    </tr>
</table>

<span style="padding-left: 10px; margin: -12px 12px 5px 7px; font-size: 15px; font-weight: bold;">
    Campeonato: {{ campeonato.Nome + ' - ' + campeonato.Ano}}
</span>

<table style="margin: 5px 10px 0 10px;">
    <tr>
        <td style="height: 280px; vertical-align: top;">
            <table class="tableDados">
                <thead>
                    <tr class="tableHead">
                        <th style="width: 240px; text-align: left; padding-left: 4px;">Nome ou Apelido</th>
                        <th style="width: 120px;">Total de Pontos</th>
                        <th style="width: 104px;"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let ranking of listaRanking">
                        <td style="padding-left: 4px;">{{ ranking.NomeApelido }}</td>
                        <td style="text-align: center;">{{ ranking.Pontos }}</td>
                        <td>
                            <button type="button" (click)="detalhes(ranking)"
                                    class="btn-primary">Ver detalhes</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </td>
    </tr>
    <tr>
        <td style="text-align: end;">
            <button type="button" (click)="fechar()" class="btn-ativo" >Fechar</button>
        </td>
    </tr>
</table>
